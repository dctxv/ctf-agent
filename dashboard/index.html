<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CTF Agent</title>
<style>
  :root {
    --bg:        #0a0d12;
    --surface:   #0f141b;
    --surface-2: #0c1016;
    --raised:    #141a22;
    --border:    #1c242e;
    --border-soft:#161d26;
    --text:      #e6edf3;
    --dim:       #96a3b2;
    --faint:     #5c6b7a;
    --accent:    #5b9dff;
    --accent-soft:#17283f;
    --green:     #4bb86a;
    --amber:     #e0a23c;
    --red:       #ec6a6a;
    --purple:    #b98cff;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: var(--sans); background: var(--bg); color: var(--text);
    display: flex; height: 100vh; overflow: hidden; font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #1e2731; border-radius: 6px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: #2a3744; background-clip: padding-box; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ---------- sidebar ---------- */
  #side {
    width: 320px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0;
  }
  #brand {
    display: flex; align-items: center; gap: 9px; padding: 15px 18px 14px;
    border-bottom: 1px solid var(--border-soft);
  }
  #brand .mark {
    width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), #3f6fd1);
    display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 12px;
    font-family: var(--mono);
  }
  #brand .name { font-weight: 600; letter-spacing: .2px; }
  #brand .name small { color: var(--faint); font-weight: 500; margin-left: 2px; }

  #tabs { display: flex; gap: 2px; padding: 10px 12px; }
  .tab {
    flex: 1; padding: 7px 0; text-align: center; cursor: pointer; background: transparent;
    border: none; color: var(--dim); font: inherit; font-size: 13px; border-radius: 7px;
    transition: background .12s, color .12s;
  }
  .tab:hover { color: var(--text); background: var(--raised); }
  .tab.active { color: var(--text); background: var(--accent-soft); font-weight: 600; }

  #panes { flex: 1; overflow-y: auto; padding: 4px 12px 14px; min-height: 0; }
  .pane-hint { font-size: 12.5px; color: var(--dim); line-height: 1.5; margin: 6px 2px 12px; }

  /* list items (sessions + experiments) */
  .item {
    display: flex; align-items: flex-start; gap: 10px; padding: 10px 11px; margin: 6px 0;
    border: 1px solid var(--border-soft); border-radius: 9px; cursor: pointer; background: var(--surface-2);
    transition: border-color .12s, background .12s;
  }
  .item:hover { border-color: #26323e; background: var(--raised); }
  .item.sel { border-color: var(--accent); background: var(--accent-soft); }
  .item .body { flex: 1; min-width: 0; }
  .item .id { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .sub { font-size: 11.5px; color: var(--dim); margin-top: 3px; line-height: 1.4;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { color: var(--faint); font-size: 13px; text-align: center; padding: 26px 10px; }

  /* status pill */
  .pill {
    display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 600;
    padding: 3px 8px; border-radius: 20px; text-transform: uppercase; letter-spacing: .4px;
    white-space: nowrap; border: 1px solid transparent;
  }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill-running  { color: var(--amber); background: rgba(224,162,60,.1);  border-color: rgba(224,162,60,.25); }
  .pill-finished,
  .pill-done     { color: var(--green); background: rgba(75,184,106,.1);  border-color: rgba(75,184,106,.25); }
  .pill-open     { color: var(--faint); background: rgba(92,107,122,.12); border-color: rgba(92,107,122,.25); }
  .pill-eval     { color: var(--accent); background: var(--accent-soft);  border-color: rgba(91,157,255,.25); }
  .pill.solved::before { display: none; }

  /* forms */
  .field { display: block; width: 100%; padding: 9px 11px; margin: 7px 0; font: inherit; font-size: 13px;
    background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; }
  .field:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .field::placeholder { color: var(--faint); }
  .btn {
    padding: 8px 15px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff; border: none; border-radius: 8px; transition: filter .12s;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn.ghost { background: var(--raised); color: var(--text); border: 1px solid var(--border); font-weight: 500; }
  .btn.ghost:hover { border-color: #2a3744; background: #19212a; filter: none; }
  .btn.danger { background: transparent; color: var(--red); border: 1px solid rgba(236,106,106,.3); font-weight: 500; }
  .btn.danger:hover { background: rgba(236,106,106,.12); filter: none; }
  .status-msg { font-size: 12px; color: var(--amber); margin-top: 8px; min-height: 16px; line-height: 1.4; }

  /* ---------- main ---------- */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #bar {
    display: flex; align-items: center; gap: 12px; padding: 12px 18px; min-height: 52px;
    border-bottom: 1px solid var(--border); background: var(--surface);
  }
  #bar .title { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #bar .title.muted { color: var(--faint); font-weight: 500; }
  #bar .spacer { flex: 1; }
  #ctrls { display: flex; gap: 7px; }

  #feed { flex: 1; overflow-y: auto; padding: 12px 16px; background: var(--surface-2); min-height: 0; }
  .feed-empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--faint); gap: 8px; }
  .feed-empty svg { opacity: .5; }

  .ev { font-family: var(--mono); font-size: 12px; line-height: 1.55; padding: 1px 0;
    display: flex; gap: 10px; white-space: pre-wrap; word-break: break-word; }
  .ev .ts { color: var(--faint); flex-shrink: 0; }
  .ev .type { color: var(--accent); flex-shrink: 0; min-width: 118px; }
  .ev .data { color: var(--dim); flex: 1; min-width: 0; }
  .tool_call .type { color: var(--amber); }
  .session_end .type, .learning_saved .type { color: var(--green); }
  .escalation .type, .budget_hit .type { color: var(--red); }
  .ask_human .type { color: var(--purple); }
  .cost_update .type { color: var(--faint); }

  /* report (eval) rendered into the feed */
  .report { font-family: var(--sans); font-size: 13px; line-height: 1.5; color: var(--text); }
  .report .headline { font-size: 15px; color: var(--green); font-weight: 600; margin-bottom: 5px; }
  .report .meta { color: var(--dim); font-size: 12.5px; }
  .report .caveat { margin: 12px 0; padding: 9px 12px; background: rgba(224,162,60,.08);
    border: 1px solid rgba(224,162,60,.2); border-left-width: 3px; border-radius: 0 8px 8px 0; color: #f0d9b5; }
  .report .caveat b { color: var(--amber); }
  .report .caveat ul { margin: 5px 0 0; padding-left: 18px; }
  .report .grp { color: var(--accent); font-weight: 600; margin: 18px 0 6px; font-size: 13px; }
  .report table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .report th { color: var(--dim); text-align: left; font-weight: 500; padding: 4px 8px; border-bottom: 1px solid var(--border); }
  .report td { padding: 5px 8px; border-bottom: 1px solid var(--border-soft); font-family: var(--mono); }
  .report td:first-child { font-family: var(--sans); }

  /* ---------- findings ---------- */
  #findings { background: var(--surface); border-top: 1px solid var(--border); overflow-y: auto;
    max-height: 46%; padding: 0; }
  #findings:empty { display: none; }
  .find-head { position: sticky; top: 0; background: var(--surface); padding: 10px 16px 8px;
    color: var(--dim); font-size: 11.5px; font-weight: 600; letter-spacing: .3px; text-transform: uppercase;
    border-bottom: 1px solid var(--border-soft); }
  .fc { margin: 9px 16px; padding: 10px 13px; background: var(--surface-2); border: 1px solid var(--border-soft);
    border-left: 3px solid var(--faint); border-radius: 0 8px 8px 0; }
  .fc .h { font-weight: 600; font-size: 13px; }
  .fc .m { font-size: 11.5px; color: var(--dim); margin-top: 3px; font-family: var(--mono); }
  .fc .d { font-size: 12.5px; color: #c6d2dc; margin-top: 6px; line-height: 1.5; }
  .sev-critical { border-left-color: var(--red); }
  .sev-high     { border-left-color: var(--amber); }
  .sev-medium   { border-left-color: var(--green); }
  .sev-low      { border-left-color: var(--accent); }
  .sev-info     { border-left-color: var(--faint); }
  .fc .sevtag { font-family: var(--mono); font-size: 10.5px; padding: 1px 6px; border-radius: 4px;
    margin-right: 6px; background: rgba(255,255,255,.05); }
</style>
</head>
<body>
  <aside id="side">
    <div id="brand">
      <div class="mark">::</div>
      <div class="name">CTF Agent <small>console</small></div>
    </div>
    <nav id="tabs">
      <button class="tab active" id="tab-sessions" onclick="showTab('sessions')">Sessions</button>
      <button class="tab" id="tab-repos" onclick="showTab('repos')">Audit</button>
      <button class="tab" id="tab-eval" onclick="showTab('eval')">Eval</button>
    </nav>
    <div id="panes">
      <div id="sessions"><div class="empty">loading&hellip;</div></div>

      <div id="repos" hidden>
        <div class="pane-hint">Static audit of a public GitHub repo &mdash; file-only, cloned host-side, never executed.</div>
        <input id="repourl" class="field" placeholder="https://github.com/owner/repo">
        <input id="repomax" class="field" type="number" value="40" min="5" max="80" title="max steps (cost scales with steps)">
        <button class="btn" onclick="startAudit()">Run audit</button>
        <div id="repostatus" class="status-msg"></div>
      </div>

      <div id="eval" hidden>
        <div class="pane-hint">Evaluation experiments &mdash; verified solve rates from the structured store.</div>
        <div id="exps"><div class="empty">loading&hellip;</div></div>
      </div>
    </div>
  </aside>

  <main id="main">
    <header id="bar">
      <div class="title muted" id="bar-title">Pick a session, or run an audit</div>
      <span class="pill" id="bar-status" hidden></span>
      <div class="spacer"></div>
      <div id="ctrls" hidden>
        <button class="btn ghost" onclick="control('pause')">Pause</button>
        <button class="btn ghost" onclick="control('resume')">Resume</button>
        <button class="btn danger" onclick="control('cancel')">Cancel</button>
      </div>
    </header>
    <div id="feed"><div class="feed-empty" id="feed-empty">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/></svg>
      <div>No session selected</div>
    </div><div id="events"></div></div>
    <div id="findings"></div>
  </main>

<script>
let es = null, pollTimer = null, curSession = null;

function token() { try { return localStorage.getItem('dashtoken') || ''; } catch (e) { return ''; } }
function authHeaders(extra) { const h = extra || {}; const t = token(); if (t) h['X-Dashboard-Token'] = t; return h; }
function withTok(url) { const t = token(); return t ? (url + (url.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(t)) : url; }
async function api(url, opts) {
  opts = opts || {};
  opts.headers = authHeaders(opts.headers || {});
  const r = await fetch(url, opts);
  if (r.status === 401) {
    const t = prompt('Dashboard token:');
    if (t) { try { localStorage.setItem('dashtoken', t); } catch (e) {} return api(url, opts); }
  }
  return r;
}
function control(action) {
  if (!curSession) return;
  api('/api/sessions/' + encId(curSession) + '/control',
      { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action }) });
}

function showTab(name) {
  for (const t of ['sessions', 'repos', 'eval']) {
    document.getElementById(t).hidden = t !== name;
    document.getElementById('tab-' + t).classList.toggle('active', t === name);
  }
  if (name === 'eval') loadExperiments();
}

function encId(id) { return id.split('/').map(encodeURIComponent).join('/'); }

// header helpers
function setTitle(text, muted) {
  const el = document.getElementById('bar-title');
  el.textContent = text; el.classList.toggle('muted', !!muted);
}
function setStatus(label, kind) {
  const p = document.getElementById('bar-status');
  if (!label) { p.hidden = true; return; }
  p.hidden = false; p.textContent = label; p.className = 'pill pill-' + (kind || 'open');
}
function showFeedEmpty(on) { document.getElementById('feed-empty').style.display = on ? 'flex' : 'none'; }

function selectItem(el) {
  for (const n of document.querySelectorAll('.item.sel')) n.classList.remove('sel');
  if (el) el.classList.add('sel');
}

async function loadSessions() {
  const el = document.getElementById('sessions');
  const prevSel = el.querySelector('.item.sel');
  const prevId = prevSel ? prevSel.dataset.id : curSession;
  try {
    const list = await (await api('/api/sessions')).json();
    el.innerHTML = '';
    if (!list.length) { el.innerHTML = '<div class="empty">No sessions yet</div>'; return; }
    for (const x of list) {
      const d = document.createElement('div');
      d.className = 'item'; d.dataset.id = x.id;
      if (x.id === prevId) d.classList.add('sel');
      const kind = x.status === 'finished' ? 'finished' : (x.status === 'running' ? 'running' : 'open');
      d.innerHTML = `<div class="body"><div class="id">${esc(x.id)}</div>`
        + `<div class="sub">${x.events} events &middot; $${x.cost_usd}${x.goal ? ' &middot; ' + esc(x.goal) : ''}</div></div>`
        + `<span class="pill pill-${kind}">${esc(x.status)}</span>`;
      d.onclick = () => { selectItem(d); openSession(x.id); };
      el.appendChild(d);
    }
  } catch (e) { el.innerHTML = '<div class="empty">failed to load sessions</div>'; }
}

function openSession(id) {
  curSession = id;
  document.getElementById('ctrls').hidden = false;
  showFindings(id);   // show cards immediately if it is a finished audit
  stream(id);
}

function stream(id) {
  if (es) es.close();
  document.getElementById('events').innerHTML = '';
  showFeedEmpty(false);
  setTitle(id, false); setStatus('streaming', 'running');
  es = new EventSource(withTok('/api/sessions/' + encId(id) + '/stream'));
  es.onmessage = (m) => { try { add(JSON.parse(m.data)); } catch (e) {} };
  es.addEventListener('end', () => {
    setStatus('done', 'done');
    es.close();
    showFindings(id);
  });
  es.onerror = () => { if (es) es.close(); };
}

function add(e) {
  const d = document.createElement('div');
  d.className = 'ev ' + (e.type || '');
  let data = JSON.stringify(e.data);
  if (data && data.length > 220) data = data.slice(0, 220) + '…';
  d.innerHTML = `<span class="ts">${(e.ts || '').slice(11, 19)}</span>`
    + `<span class="type">${esc(e.type)}</span><span class="data">${esc(data)}</span>`;
  const f = document.getElementById('events');
  f.appendChild(d);
  f.parentElement.scrollTop = f.parentElement.scrollHeight;
}

async function showFindings(id) {
  const box = document.getElementById('findings');
  box.innerHTML = '';
  try {
    const fs = await (await api('/api/sessions/' + encId(id) + '/findings')).json();
    if (!fs.length) return;
    const hdr = document.createElement('div');
    hdr.className = 'find-head';
    hdr.textContent = `Findings (${fs.length}) · most severe first`;
    box.appendChild(hdr);
    for (const f of fs) {
      const sev = String(f.severity || 'info').toLowerCase();
      const c = document.createElement('div');
      c.className = 'fc sev-' + sev;
      c.innerHTML = `<div class="h"><span class="sevtag">${esc(sev.toUpperCase())}</span>${esc(f.title || '')}</div>`
        + `<div class="m">${esc(f.file || '')}${f.line ? ':' + esc(f.line) : ''} &middot; ${esc(f.cwe || '')} &middot; conf ${esc(f.confidence || '?')}${f.poc ? ' &middot; ' + esc(f.poc) : ''}${f.verdict ? ' &middot; ' + verdictSpan(f.verdict) : ''}</div>`
        + (f.description ? `<div class="d">${esc(f.description)}</div>` : '');
      box.appendChild(c);
    }
  } catch (e) {}
}

async function startAudit() {
  const url = document.getElementById('repourl').value.trim();
  const max_steps = parseInt(document.getElementById('repomax').value) || 40;
  const st = document.getElementById('repostatus');
  if (!/^https:\/\/github\.com\/[^/]+\/[^/]+/.test(url)) { st.textContent = 'enter a https://github.com/owner/repo URL'; return; }
  st.textContent = 'launching…';
  let id;
  try {
    const r = await api('/api/github/audit', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url, max_steps }) });
    if (!r.ok) { st.textContent = 'error: ' + (await r.text()); return; }
    id = (await r.json()).session_id;
  } catch (e) { st.textContent = 'request failed'; return; }
  st.textContent = 'cloning + starting ' + id + ' …';
  curSession = id;
  document.getElementById('ctrls').hidden = false;
  setTitle(id, false); setStatus('cloning', 'running');
  document.getElementById('events').innerHTML = '';
  document.getElementById('findings').innerHTML = '';
  showFeedEmpty(false);
  if (pollTimer) clearInterval(pollTimer);
  let tries = 0;
  pollTimer = setInterval(async () => {
    tries++;
    try {
      const l = await (await api('/api/sessions')).json();
      if (l.some(s => s.id === id)) { clearInterval(pollTimer); st.textContent = 'streaming ' + id; loadSessions(); stream(id); }
    } catch (e) {}
    if (tries > 60) { clearInterval(pollTimer); st.textContent = 'timed out waiting for the session to start'; }
  }, 1500);
}

async function loadExperiments() {
  const el = document.getElementById('exps');
  try {
    const list = await (await api('/api/eval/experiments')).json();
    el.innerHTML = '';
    if (!list.length) { el.innerHTML = '<div class="empty">No experiments yet<br>(run run_experiment.py)</div>'; return; }
    for (const x of list) {
      const d = document.createElement('div');
      d.className = 'item';
      d.innerHTML = `<div class="body"><div class="id">${esc(x.experiment_id)}</div>`
        + `<div class="sub">${x.infra} infra &middot; ${esc((x.last_ts || '').slice(0, 19).replace('T', ' '))}</div></div>`
        + `<span class="pill pill-finished solved">${x.solved}/${x.trials}</span>`;
      d.onclick = () => { selectItem(d); openExperiment(x.experiment_id); };
      el.appendChild(d);
    }
  } catch (e) { el.innerHTML = '<div class="empty">failed to load experiments</div>'; }
}

async function openExperiment(exp) {
  curSession = null;
  document.getElementById('ctrls').hidden = true;
  if (es) es.close();
  if (pollTimer) clearInterval(pollTimer);
  setTitle('Eval · ' + exp, false); setStatus('report', 'eval');
  document.getElementById('findings').innerHTML = '';
  showFeedEmpty(false);
  const feed = document.getElementById('events');
  feed.innerHTML = '<div class="report">loading report…</div>';
  try {
    const s = await (await api('/api/eval/report?experiment=' + encodeURIComponent(exp))).json();
    feed.innerHTML = s.empty ? '<div class="report">no rows for this experiment</div>' : renderReport(s);
  } catch (e) { feed.innerHTML = '<div class="report">failed to load report</div>'; }
}

function rate(a) {
  if (!a.n) return '0/0';
  return `${a.solved}/${a.n} (${Math.round(a.solve_rate * 100)}%, 95% CI ${Math.round(a.ci_low * 100)}-${Math.round(a.ci_high * 100)}%)`;
}

function grpTable(title, grp) {
  let h = `<div class="grp">${esc(title)}</div>`;
  h += '<table><tr><th>key</th><th>solve rate</th><th>mean $</th><th>steps</th><th>infra</th></tr>';
  for (const k of Object.keys(grp)) {
    const a = grp[k];
    h += `<tr><td>${esc(k)}</td><td>${esc(rate(a))}</td><td>${a.mean_cost_usd}</td><td>${a.mean_steps}</td><td>${a.infra_errors}</td></tr>`;
  }
  return h + '</table>';
}

function renderReport(s) {
  const o = s.overall;
  let h = '<div class="report">';
  h += `<div class="headline">Verified solve rate: ${esc(rate(o))}</div>`;
  h += `<div class="meta">infra excluded: ${o.infra_errors} &middot; mean $${o.mean_cost_usd} &middot; mean steps ${o.mean_steps} &middot; mean ${o.mean_duration_s}s</div>`;
  if (s.caveats && s.caveats.length) {
    h += '<div class="caveat"><b>Read with care</b><ul>';
    for (const c of s.caveats) h += `<li>${esc(c)}</li>`;
    h += '</ul></div>';
  }
  h += grpTable('By category', s.by_category);
  h += grpTable('By challenge', s.by_challenge);
  if (Object.keys(s.by_config).length > 1) h += grpTable('By config', s.by_config);
  return h + '</div>';
}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

function verdictSpan(v) {
  const c = { confirmed: 'var(--green)', refuted: 'var(--red)', uncertain: 'var(--amber)' }[v] || 'var(--dim)';
  return `<b style="color:${c}">${esc(v)}</b>`;
}

loadSessions();
setInterval(loadSessions, 5000);  // keep statuses fresh (running -> finished)
